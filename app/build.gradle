plugins {
    id 'com.android.application'
}

android {
    namespace 'net.socheat.apps.khmerunicodelayoutforexternalkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "net.socheat.apps.khmerunicodelayoutforexternalkeyboard"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "0.4.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// The layout file is the product. Refuse to build one Android would reject:
// a single bad key block makes the platform discard the whole .kcm and fall
// back to Generic.kcm, with no error shown to the user.
tasks.register('validateKcm', Exec) {
    description = 'Parses the .kcm the way the Android platform parser does.'
    group = 'verification'
    commandLine 'python3',
            rootProject.file('tools/validate_kcm.py'),
            file('src/main/res/raw/keyboard_layout_khmer.kcm')
}
tasks.named('preBuild') { dependsOn 'validateKcm' }
